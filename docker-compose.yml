services:

  mysql:
    image: mysql:8.0
    container_name: pmt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-pmt}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pmt-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: pmt-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pmt-network

  backend:
    build:
      context: ./Back
    image: ${DOCKERHUB_USER:-pmt}/pmt-backend:${TAG:-latest}
    container_name: pmt-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pmt}
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - pmt-network

networks:
  pmt-network:
    driver: bridge

volumes:
  mysql-data:
