name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend - build et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    steps:
      - name: récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build, tests et couverture
        run: mvn -B verify

      - name: Publier le rapport de couverture backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-backend
          path: Back/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: Frontend - build et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front
    steps:
      - name: recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests et couverture
        run: npm run test:ci

      - name: Build de production
        run: npm run build -- --configuration production

      - name: Publier le rapport de couverture frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-frontend
          path: Front/coverage/
          if-no-files-found: warn

  deploiement:
    name: Images Docker Hub
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        include:
          - nom: backend
            contexte: ./Back
            image: pmt-backend
          - nom: frontend
            contexte: ./Front
            image: pmt-frontend

    steps:
      - name: récupérer le code
        uses: actions/checkout@v4

      - name: Preparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et pousser l'image ${{ matrix.nom }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
