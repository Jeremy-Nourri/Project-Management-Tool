name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend - build et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    steps:
      - name: recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build, tests et couverture
        run: mvn -B verify

      - name: Publier le rapport de couverture backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-backend
          path: Back/target/site/jacoco/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Deploiement : construit l'image Docker du backend et la publie sur
  # Docker Hub. Ne s'execute que si le job backend est vert ET uniquement
  # sur main : une pull request ne doit jamais publier d'image.
  # ---------------------------------------------------------------------------
  deploiement-backend:
    name: Backend - image Docker Hub
    runs-on: ubuntu-latest
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: recuperer le code
        uses: actions/checkout@v4

      - name: Preparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et pousser l'image du backend
        uses: docker/build-push-action@v6
        with:
          context: ./Back
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pmt-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pmt-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
